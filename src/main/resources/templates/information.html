<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<th:block layout:fragment="content">

<div class="container-fluid px-4 py-3">

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
                <i class="far fa-eye mr-1"></i>가로기 운영안내
            </h6>
        </div>
        <div class="card-body">

            <!-- 탭 네비게이션 -->
            <ul class="nav nav-tabs mb-3" id="infoTabs" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active font-weight-bold" id="tab1-tab"
                       data-toggle="tab" href="#tab1" role="tab">
                        <i class="fas fa-calendar-check mr-1"></i>가로기 예약 방법
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link font-weight-bold" id="tab2-tab"
                       data-toggle="tab" href="#tab2" role="tab">
                        <i class="fas fa-ruler-combined mr-1"></i>가로기 제작 규격
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link font-weight-bold" id="tab3-tab"
                       data-toggle="tab" href="#tab3" role="tab">
                        <i class="fas fa-tools mr-1"></i>가로기 제작 방법
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link font-weight-bold" id="tab4-tab"
                       data-toggle="tab" href="#tab4" role="tab">
                        <i class="fas fa-file-alt mr-1"></i>신고방법
                    </a>
                </li>
            </ul>

            <!-- 탭 콘텐츠 -->
            <div class="tab-content" id="infoTabContent">

                <div class="tab-pane fade show active" id="tab1" role="tabpanel">
                    <div class="text-center">
                        <img src="/assets/img/Notice1.jpg" alt="가로기 예약 방법"
                             style="max-width:860px; width:100%; height:auto; border-radius:6px; border:1px solid #e3e6f0;">
                    </div>
                </div>

                <div class="tab-pane fade" id="tab2" role="tabpanel">
                    <div class="text-center">
                        <img src="/assets/img/Notice2.jpg" alt="가로기 제작 규격"
                             style="max-width:860px; width:100%; height:auto; border-radius:6px; border:1px solid #e3e6f0;">
                    </div>
                </div>

                <div class="tab-pane fade" id="tab3" role="tabpanel">
                    <div class="text-center">
                        <img src="/assets/img/Notice3.jpg" alt="가로기 제작 방법"
                             style="max-width:860px; width:100%; height:auto; border-radius:6px; border:1px solid #e3e6f0;">
                    </div>
                </div>

                <div class="tab-pane fade" id="tab4" role="tabpanel">
                    <div class="text-center">
                        <img src="/assets/img/_5.png" alt="신고방법"
                             style="max-width:860px; width:100%; height:auto; border-radius:6px; border:1px solid #e3e6f0;">
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>

</th:block>
</html>
