<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">

<th:block layout:fragment="content">
<body id="page-top">

<style>
/* ── 화면 공통 ── */
.settlement-wrap { max-width: 960px; margin: 0 auto; }

/* ── 결산서 문서 영역 ── */
#settlement-doc {
    background: #fff;
    padding: 40px 48px;
    border: 1px solid #dee2e6;
    border-radius: 6px;
}
.doc-title {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 6px;
    margin-bottom: 6px;
}
.doc-subtitle {
    text-align: center;
    font-size: 0.95rem;
    color: #6c757d;
    margin-bottom: 28px;
}
.doc-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    margin-bottom: 20px;
    color: #495057;
}
.settlement-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
}
.settlement-table th {
    background: #343a40;
    color: #fff;
    padding: 8px 10px;
    text-align: center;
    font-weight: 600;
    white-space: nowrap;
}
.settlement-table td {
    padding: 7px 10px;
    border-bottom: 1px solid #e9ecef;
    vertical-align: middle;
}
.settlement-table tr.row-data:hover { background: #f8f9fa; }
.settlement-table tr.row-subtotal td {
    background: #f1f3f5;
    font-weight: 600;
    color: #495057;
}
.settlement-table tr.row-subtotal td.label {
    text-align: right;
    color: #6c757d;
    font-size: 0.82rem;
}
.settlement-table tr.row-total td {
    background: #343a40;
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
}
.text-right { text-align: right; }
.text-center { text-align: center; }
.badge-order  { color: #4e73df; font-weight: 600; }
.badge-payed  { color: #1cc88a; font-weight: 600; }
.badge-cancel { color: #858796; }

.doc-footer {
    margin-top: 32px;
    text-align: center;
    font-size: 0.8rem;
    color: #adb5bd;
    border-top: 1px solid #e9ecef;
    padding-top: 16px;
}

/* ── 인쇄 스타일 ── */
@media print {
    body * { visibility: hidden; }
    #settlement-doc, #settlement-doc * { visibility: visible; }
    #settlement-doc {
        position: absolute; top: 0; left: 0;
        width: 100%; border: none; padding: 20px 30px;
    }
    .no-print { display: none !important; }
    .settlement-table th { background: #343a40 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .settlement-table tr.row-subtotal td { background: #f1f3f5 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .settlement-table tr.row-total td { background: #343a40 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

<div class="container-fluid">
    <div class="settlement-wrap">

        <!-- ── 검색 바 (화면 전용, 인쇄 시 숨김) ── -->
        <div class="card shadow mb-4 no-print">
            <div class="card-body py-3">
                <form th:object="${orderSearch}" class="form-inline" id="searchForm">
                    <label class="mr-2 font-weight-bold">조회 월</label>
                    <input type="month" id="monthInput"
                           th:field="*{findDate}"
                           min="2022-07" max="2040-06"
                           class="form-control mr-3">
                    <button type="submit" class="btn btn-primary mr-2">조회</button>
                    <button type="button" class="btn btn-outline-secondary"
                            onclick="window.print()">
                        <i class="fas fa-print mr-1"></i>PDF 출력
                    </button>
                </form>
            </div>
        </div>

        <!-- ── 결산서 문서 ── -->
        <div id="settlement-doc">

            <div class="doc-title">가 로 기 게 첨 결 산 서</div>
            <div class="doc-subtitle">여수시 광고협회</div>

            <div class="doc-meta">
                <span>
                    <strong>정산 기간:</strong>
                    <span th:text="${#strings.replace(findMonth, '-', '년 ') + '월'}">2026년 05월</span>
                </span>
                <span>
                    <strong>작성일:</strong>
                    <span th:text="${#dates.format(#dates.createNow(), 'yyyy년 MM월 dd일')}"></span>
                </span>
            </div>

            <!-- 데이터 없을 때 -->
            <div th:if="${#lists.isEmpty(reportList) or (#lists.size(reportList) == 1 and reportList[0].rowType == 'TOTAL')}"
                 class="text-center text-muted py-4">
                해당 월의 게첨 내역이 없습니다.
            </div>

            <!-- 결산 테이블 -->
            <table class="settlement-table"
                   th:unless="${#lists.isEmpty(reportList) or (#lists.size(reportList) == 1 and reportList[0].rowType == 'TOTAL')}">
                <thead>
                <tr>
                    <th style="width:40px">No</th>
                    <th>공연명</th>
                    <th>신청자</th>
                    <th>게첨 구간</th>
                    <th>시작일</th>
                    <th>종료일</th>
                    <th style="width:50px">수량</th>
                    <th>단가</th>
                    <th>금액</th>
                    <th style="width:70px">상태</th>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="row : ${reportList}">

                    <!-- 데이터 행 -->
                    <tr th:if="${row.rowType == 'DATA'}" class="row-data">
                        <td class="text-center" th:text="${row.seq}"></td>
                        <td th:text="${row.orderName}"></td>
                        <td th:text="${row.memberName}"></td>
                        <td th:text="${row.sectionName}"></td>
                        <td class="text-center" th:text="${row.startDate}"></td>
                        <td class="text-center" th:text="${row.endDate}"></td>
                        <td class="text-center" th:text="${row.count}"></td>
                        <td class="text-right" th:text="${#numbers.formatInteger(row.unitPrice, 0, 'COMMA') + '원'}"></td>
                        <td class="text-right" th:text="${#numbers.formatInteger(row.amount, 0, 'COMMA') + '원'}"></td>
                        <td class="text-center"
                            th:classappend="${row.statusLabel == '결제완료'} ? 'badge-payed' : (${row.statusLabel == '취소'} ? 'badge-cancel' : 'badge-order')"
                            th:text="${row.statusLabel}"></td>
                    </tr>

                    <!-- 소계 행 -->
                    <tr th:if="${row.rowType == 'SUBTOTAL'}" class="row-subtotal">
                        <td colspan="7" class="label"
                            th:text="${row.orderName + ' 소계'}"></td>
                        <td colspan="2" class="text-right"
                            th:text="${#numbers.formatInteger(row.amount, 0, 'COMMA') + '원'}"></td>
                        <td></td>
                    </tr>

                    <!-- 합계 행 -->
                    <tr th:if="${row.rowType == 'TOTAL'}" class="row-total">
                        <td colspan="7" class="text-center" style="letter-spacing:4px">합 계</td>
                        <td colspan="2" class="text-right"
                            th:text="${#numbers.formatInteger(row.amount, 0, 'COMMA') + '원'}"></td>
                        <td></td>
                    </tr>

                </th:block>
                </tbody>
            </table>

            <div class="doc-footer">
                전라남도목욕관광협회 여수시지부 &nbsp;|&nbsp;
                소재지: (우)59629 전라남도 여수시 미평 10길 1 &nbsp;|&nbsp;
                대표전화: 061-652-2190
            </div>
        </div>
        <!-- /settlement-doc -->

    </div>
</div>

<script th:inline="javascript">
    var savedMonth = [[${findMonth}]];
    var input = document.getElementById('monthInput');
    if (input && savedMonth) input.value = savedMonth;
</script>

</body>
</th:block>
</html>
