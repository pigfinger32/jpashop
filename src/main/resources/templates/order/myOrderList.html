<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<th:block layout:fragment="content">

<style>
.myorder-table { width:100%; border-collapse:collapse; font-size:0.88rem; }
.myorder-table th {
    background:#343a40; color:#fff; padding:8px 10px;
    text-align:center; font-weight:600; white-space:nowrap;
}
.myorder-table td { padding:7px 10px; border-bottom:1px solid #e9ecef; vertical-align:middle; }
.myorder-table tr:hover td { background:#f8f9fa; }
.text-right  { text-align:right; }
.text-center { text-align:center; }
.badge-order  { color:#4e73df; font-weight:600; }
.badge-payed  { color:#1cc88a; font-weight:600; }
.badge-cancel { color:#858796; }
</style>

<div class="container-fluid px-4 py-3">
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary"
                th:text="${isAdmin} ? '전체 신청현황 (관리자)' : '내 신청현황'"></h6>
        </div>
        <div class="card-body">

            <!-- 데이터 없을 때 -->
            <div th:if="${#lists.isEmpty(orders)}" class="text-center text-muted py-4">
                신청 내역이 없습니다.
            </div>

            <!-- 신청 테이블 -->
            <div th:unless="${#lists.isEmpty(orders)}" class="table-responsive">
                <table class="myorder-table">
                    <thead>
                    <tr>
                        <th style="width:40px">No</th>
                        <th>업체명</th>
                        <th>공연명</th>
                        <th>시작일</th>
                        <th>종료일</th>
                        <th>기간</th>
                        <th style="width:50px">수량</th>
                        <th>단가</th>
                        <th>합계</th>
                        <th style="width:70px">상태</th>
                        <th style="width:60px"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${orders}">
                        <td class="text-center" th:text="${row.seq}"></td>
                        <td th:text="${row.memberName}"></td>
                        <td th:text="${row.orderName}"></td>
                        <td class="text-center" th:text="${row.startDate}"></td>
                        <td class="text-center" th:text="${row.endDate}"></td>
                        <td class="text-center" th:text="${row.term + '일'}"></td>
                        <td class="text-center" th:text="${row.count}"></td>
                        <td class="text-right"
                            th:text="${#numbers.formatInteger(row.unitPrice, 0, 'COMMA') + '원'}"></td>
                        <td class="text-right"
                            th:text="${#numbers.formatInteger(row.amount, 0, 'COMMA') + '원'}"></td>
                        <td class="text-center"
                            th:classappend="${row.statusLabel == '결제완료'} ? 'badge-payed' :
                                           (${row.statusLabel == '취소'} ? 'badge-cancel' : 'badge-order')"
                            th:text="${row.statusLabel}"></td>
                        <td class="text-center">
                            <div th:if="${row.statusLabel == '신청'}" style="display:flex;gap:4px;justify-content:center;">
                                <form th:if="${isAdmin}"
                                      th:action="@{/myOrders/{id}/payed(id=${row.orderId})}"
                                      method="post" style="margin:0">
                                    <button type="submit" class="btn btn-success btn-sm"
                                            onclick="return confirm('결제완료로 변경하시겠습니까?')">결제완료</button>
                                </form>
                                <form th:action="@{/myOrders/{id}/cancel(id=${row.orderId})}"
                                      method="post" style="margin:0">
                                    <button type="submit" class="btn btn-danger btn-sm"
                                            onclick="return confirm('예약을 취소하시겠습니까?')">취소</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</th:block>
</html>
