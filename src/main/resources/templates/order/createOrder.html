<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<th:block layout:fragment="content">

<style>
.map-marker { display:flex; flex-direction:column; align-items:center; cursor:pointer; user-select:none; }
.marker-bubble {
    padding: 4px 10px; border-radius: 14px; font-size: 12px; font-weight: bold;
    color: #fff; white-space: nowrap;
    border: 2px solid rgba(255,255,255,0.85);
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    transition: transform 0.15s;
}
.marker-bubble:hover { transform: scale(1.08); }
.marker-bubble.selected { border-color: #333; box-shadow: 0 0 0 3px rgba(0,0,0,0.25); transform: scale(1.15); }
.marker-tail { width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:8px solid; }
.marker-success .marker-bubble { background:#28a745; }
.marker-success .marker-tail   { border-top-color:#28a745; }
.marker-warning .marker-bubble { background:#ffc107; color:#333; }
.marker-warning .marker-tail   { border-top-color:#ffc107; }
.marker-danger  .marker-bubble { background:#dc3545; }
.marker-danger  .marker-tail   { border-top-color:#dc3545; }
</style>

<div class="container-fluid px-4 py-3">

    <!-- 날짜 검색 + 지도 버튼 -->
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">게첨 날짜 조회</h6>
            <button type="button" class="btn btn-info btn-sm"
                    data-toggle="modal" data-target="#flagMapModal">
                <i class="fas fa-map-marked-alt mr-1"></i>구간 지도 보기
            </button>
        </div>
        <div class="card-body py-2">
            <form th:object="${orderSearch}" class="form-inline">
                <input type="date" th:field="*{findDate}" class="form-control mr-2">
                <button type="submit" class="btn btn-primary">조회</button>
            </form>
        </div>
    </div>

    <!-- 카카오 지도 -->
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">구간 위치 지도</h6>
            <small class="text-muted">마커 클릭 시 구간이 자동 선택됩니다</small>
        </div>
        <div class="card-body p-0">
            <div id="kakaoMap" style="width:100%;height:420px;border-radius:0 0 4px 4px;"></div>
        </div>
    </div>

    <!-- 구간 현황 (프로그레스 바) -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">구간별 잔여 현황</h6>
        </div>
        <div class="card-body table-responsive">
            <table class="table table-bordered table-hover text-center mb-0">
                <thead class="thead-light">
                <tr>
                    <th>구간명</th>
                    <th>시작지점</th>
                    <th>종료지점</th>
                    <th>총수량</th>
                    <th style="min-width:180px">잔여 현황</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${itemList}"
                    th:classappend="${item.curStock == 0} ? 'table-danger' : ''">
                    <td class="font-weight-bold align-middle" th:text="${item.name}"></td>
                    <td class="align-middle" th:text="${item.startPlace}"></td>
                    <td class="align-middle" th:text="${item.endPlace}"></td>
                    <td class="align-middle" th:text="${item.stockQuantity}"></td>
                    <td class="align-middle">
                        <div class="d-flex align-items-center">
                            <div class="progress flex-grow-1 mr-2" style="height:20px;">
                                <div class="progress-bar font-weight-bold"
                                     th:classappend="${item.curStock == 0 ? 'bg-danger' : (item.curStock le 20 ? 'bg-warning' : 'bg-success')}"
                                     role="progressbar"
                                     th:style="|width: ${item.stockQuantity != 0 ? item.curStock * 100 / item.stockQuantity : 0}%|"
                                     th:text="${item.curStock} + '/' + ${item.stockQuantity}">
                                </div>
                            </div>
                        </div>
                    </td>
                    <td class="align-middle">
                        <span class="badge badge-pill"
                              th:classappend="${item.curStock == 0 ? 'badge-danger' : (item.curStock le 20 ? 'badge-warning' : 'badge-success')}"
                              th:text="${item.curStock == 0 ? '마감' : (item.curStock le 20 ? '부족' : '여유')}">
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 예약 신청 폼 -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">예약 신청</h6>
        </div>
        <div class="card-body">
            <form id="orderForm" action="/order" method="post">
                <input type="hidden" id="hiddenStartDate" name="startDate">
                <input type="hidden" id="hiddenTerm" name="term" value="30">
                <select id="memberSelect" name="memberId" style="display:none">
                    <option th:each="member : ${members}" th:value="${member.id}" th:text="${member.name}"/>
                </select>
                <div id="hiddenItemInputs"></div>

                <div class="row align-items-end">
                    <div class="col-md-4 form-group mb-2">
                        <label class="font-weight-bold">공연명</label>
                        <input type="text" id="orderNameInput" class="form-control" placeholder="공연명을 입력하세요">
                    </div>
                    <div class="col-md-3 form-group mb-2">
                        <label class="font-weight-bold">구간 선택</label>
                        <select id="itemSelect" class="form-control">
                            <option value="">구간을 선택하세요</option>
                            <option th:each="item : ${items}"
                                    th:value="${item.id}"
                                    th:text="${item.name}"/>
                        </select>
                    </div>
                    <div class="col-md-2 form-group mb-2">
                        <label class="font-weight-bold">수량</label>
                        <select id="countSelect" class="form-control">
                            <option value="">선택</option>
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="15">15</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                    <div class="col-md-2 form-group mb-2">
                        <label class="font-weight-bold">주문기간(일)</label>
                        <div class="mt-1">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="termRadio" id="term15" value="15" onchange="onTermChange(this)">
                                <label class="form-check-label" for="term15">15Day</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="termRadio" id="term30" value="30" checked onchange="onTermChange(this)">
                                <label class="form-check-label" for="term30">30Day</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-1 form-group mb-2">
                        <button type="button" class="btn btn-success btn-block" onclick="addItem()">추가</button>
                    </div>
                </div>

                <div id="selectedSection" style="display:none" class="mt-2">
                    <hr>
                    <h6 class="font-weight-bold mb-3">선택된 구간 목록</h6>
                    <table class="table table-bordered text-center">
                        <thead class="thead-light">
                        <tr>
                            <th>구간</th>
                            <th>수량</th>
                            <th>기간</th>
                            <th>금액</th>
                            <th>삭제</th>
                        </tr>
                        </thead>
                        <tbody id="selectedTableBody"></tbody>
                        <tfoot>
                        <tr class="font-weight-bold bg-light">
                            <td colspan="3" class="text-right">총 금액</td>
                            <td class="text-primary" id="totalPriceCell">0원</td>
                            <td></td>
                        </tr>
                        </tfoot>
                    </table>
                    <div class="text-right">
                        <button type="submit" class="btn btn-primary btn-lg px-5" onclick="return prepareSubmit()">예약하기</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

</div>

<!-- 구간 지도 모달 -->
<div class="modal fade" id="flagMapModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title font-weight-bold">구간 지도</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body p-1">
                <img src="/assets/img/yeasuFlagMap2.png" class="img-fluid w-100" alt="구간 지도">
            </div>
        </div>
    </div>
</div>

<!-- 카카오맵 API -->
<script type="text/javascript"
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=8a40aa84e4b695bb1391b34691db972f&autoload=false"
        onerror="showMapError('카카오맵 SDK 로드 실패')"></script>

<script th:inline="javascript">
    var serverDate   = /*[[${startDate}]]*/ null;
    var itemListData = /*[[${itemList}]]*/ [];
    var UNIT_PRICE   = 30000;
    var selectedItems = [];

    // 14구간 중심 좌표 (여수시 국동사거리 → 학동삼거리)
    var SECTION_COORDS = [
        { lat: 34.7393, lng: 127.7481 }, // 1구간
        { lat: 34.7399, lng: 127.7450 }, // 2구간
        { lat: 34.7363, lng: 127.7363 }, // 3구간
        { lat: 34.7308, lng: 127.7196 }, // 4구간
        { lat: 34.7260, lng: 127.7112 }, // 5구간
        { lat: 34.7237, lng: 127.7038 }, // 6구간
        { lat: 34.7251, lng: 127.6958 }, // 7구간
        { lat: 34.7293, lng: 127.6882 }, // 8구간
        { lat: 34.7350, lng: 127.6822 }, // 9구간
        { lat: 34.7403, lng: 127.6769 }, // 10구간
        { lat: 34.7452, lng: 127.6713 }, // 11구간
        { lat: 34.7492, lng: 127.6653 }, // 12구간
        { lat: 34.7528, lng: 127.6591 }, // 13구간
        { lat: 34.7556, lng: 127.6525 }  // 14구간
    ];

    var overlays    = []; // { itemId, overlay, coord, item }
    var kakaoMapObj = null;

    document.addEventListener('DOMContentLoaded', function () {
        var today = new Date().toISOString().substring(0, 10);
        document.getElementById('hiddenStartDate').value = serverDate || today;
    });

    /* ---- 마커 헬퍼 ---- */
    function colorClass(curStock) {
        return curStock === 0 ? 'marker-danger' : (curStock <= 20 ? 'marker-warning' : 'marker-success');
    }

    function markerContent(item, selected) {
        var cc = colorClass(item.curStock);
        var bc = 'marker-bubble' + (selected ? ' selected' : '');
        return '<div class="map-marker ' + cc + '" onclick="onMarkerClick(\'' + item.id + '\')">'
             + '<div class="' + bc + '">' + item.name + ' (' + item.curStock + ')</div>'
             + '<div class="marker-tail"></div>'
             + '</div>';
    }

    window.onMarkerClick = function (itemId) {
        var sid = String(itemId);
        document.getElementById('itemSelect').value = sid;
        applyHighlight(sid);
    };

    function applyHighlight(itemId) {
        overlays.forEach(function (o) {
            o.overlay.setContent(markerContent(o.item, String(o.item.id) === String(itemId)));
        });
    }

    /* ---- 카카오맵 초기화 ---- */
    function showMapError(msg) {
        var el = document.getElementById('kakaoMap');
        if (el) el.innerHTML =
            '<div class="d-flex flex-column justify-content-center align-items-center h-100 text-muted">'
          + '<i class="fas fa-map-marked-alt fa-3x mb-3"></i>'
          + '<p class="mb-1 font-weight-bold">지도를 불러올 수 없습니다</p>'
          + '<small>' + (msg || '') + '</small>'
          + '<small class="mt-2 text-info">카카오 개발자 콘솔 → 플랫폼 → Web → 사이트 도메인에<br>'
          + '<strong>http://180.210.82.98</strong> 등록 필요</small>'
          + '</div>';
    }

    if (typeof kakao === 'undefined') {
        showMapError('카카오맵 SDK 로드 실패 (네트워크 또는 API 키 오류)');
    } else {
        kakao.maps.load(function () {
            try {
                var container = document.getElementById('kakaoMap');
                kakaoMapObj = new kakao.maps.Map(container, {
                    center: new kakao.maps.LatLng(34.7390, 127.7080),
                    level: 8
                });

                itemListData.forEach(function (item, idx) {
                    var coord = SECTION_COORDS[idx];
                    if (!coord) return;
                    var overlay = new kakao.maps.CustomOverlay({
                        map: kakaoMapObj,
                        position: new kakao.maps.LatLng(coord.lat, coord.lng),
                        content: markerContent(item, false),
                        yAnchor: 1
                    });
                    overlays.push({ itemId: String(item.id), overlay: overlay, coord: coord, item: item });
                });

                document.getElementById('itemSelect').addEventListener('change', function () {
                    var id = this.value;
                    if (!id) return;
                    var found = overlays.find(function (o) { return o.itemId === id; });
                    if (found) {
                        kakaoMapObj.panTo(new kakao.maps.LatLng(found.coord.lat, found.coord.lng));
                        kakaoMapObj.setLevel(5, { animate: true });
                        applyHighlight(id);
                    }
                });
            } catch (e) {
                showMapError(e.message);
            }
        });
    }

    /* ---- 주문 폼 로직 ---- */
    function onTermChange(radio) {
        document.getElementById('hiddenTerm').value = radio.value;
    }

    function calcPrice(count, term) {
        return (term === '15' ? UNIT_PRICE / 2 : UNIT_PRICE) * parseInt(count);
    }

    function addItem() {
        var orderName = document.getElementById('orderNameInput').value.trim();
        var sel       = document.getElementById('itemSelect');
        var itemId    = sel.value;
        var itemText  = sel.options[sel.selectedIndex].text;
        var count     = document.getElementById('countSelect').value;
        var term      = document.querySelector('input[name="termRadio"]:checked').value;
        var date      = document.getElementById('hiddenStartDate').value;
        var memberId  = document.getElementById('memberSelect').value;

        if (!orderName) { alert('공연명을 입력하세요.');  return; }
        if (!itemId)    { alert('구간을 선택하세요.');    return; }
        if (!count)     { alert('수량을 선택하세요.');    return; }
        if (selectedItems.some(function (i) { return i.itemId === itemId; })) {
            alert('이미 추가된 구간입니다. 삭제 후 다시 추가하세요.'); return;
        }

        selectedItems.push({
            date: date, memberId: memberId, orderName: orderName,
            itemId: itemId, itemText: itemText,
            count: count, term: term,
            price: calcPrice(count, term)
        });
        renderTable();
    }

    function removeItem(itemId) {
        selectedItems = selectedItems.filter(function (i) { return i.itemId !== itemId; });
        renderTable();
    }

    function renderTable() {
        var tbody   = document.getElementById('selectedTableBody');
        var section = document.getElementById('selectedSection');
        if (selectedItems.length === 0) {
            section.style.display = 'none';
            tbody.innerHTML = '';
            return;
        }
        section.style.display = 'block';
        tbody.innerHTML = selectedItems.map(function (item) {
            return '<tr>'
                + '<td>' + item.itemText + '</td>'
                + '<td>' + item.count + '</td>'
                + '<td>' + item.term + '일</td>'
                + '<td class="text-primary font-weight-bold">' + item.price.toLocaleString() + '원</td>'
                + '<td><button type="button" class="btn btn-danger btn-sm"'
                + ' onclick="removeItem(\'' + item.itemId + '\')">삭제</button></td>'
                + '</tr>';
        }).join('');
        var total = selectedItems.reduce(function (s, i) { return s + i.price; }, 0);
        document.getElementById('totalPriceCell').textContent = total.toLocaleString() + '원';
    }

    function prepareSubmit() {
        if (selectedItems.length === 0) { alert('구간을 추가해주세요.'); return false; }
        var c = document.getElementById('hiddenItemInputs');
        c.innerHTML = selectedItems.map(function (item) {
            var val = [item.date, item.memberId, item.orderName, item.itemId, item.count, item.term].join('%');
            return '<input type="hidden" name="addItem" value="' + val + '">';
        }).join('');
        return true;
    }
</script>
</th:block>
</html>
