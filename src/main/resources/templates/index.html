<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<th:block layout:fragment="content">

<style>
/* 공지사항 */
.notice-list a { color:#333; text-decoration:none; font-size:0.85rem; }
.notice-list a:hover { color:#4e73df; text-decoration:underline; }
.notice-list .notice-date { color:#999; font-size:0.78rem; white-space:nowrap; }
.notice-list li { padding:6px 0; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.notice-list li:last-child { border-bottom:none; }

/* 민원/수수료 박스 */
.info-card { border-radius:8px; padding:18px 20px; display:flex; align-items:center; gap:16px; }
.info-card.blue  { background:#1b4f8a; color:#fff; }
.info-card.green { background:#1a6e44; color:#fff; }
.info-card-icon { font-size:2.2rem; opacity:0.85; flex-shrink:0; }
.info-card-body h6 { font-weight:700; font-size:0.88rem; margin-bottom:4px; opacity:0.85; letter-spacing:.5px; }
.info-card-body .phone { font-size:1.4rem; font-weight:800; letter-spacing:1px; }
.info-card-body .account { font-size:1.1rem; font-weight:700; letter-spacing:.5px; }
.info-card-body small { opacity:0.8; font-size:0.78rem; }

/* 접수절차 */
.proc-wrap { display:flex; align-items:flex-start; flex-wrap:wrap; gap:0; }
.proc-step { text-align:center; flex:1; min-width:80px; padding:0 4px; }
.proc-circle {
    width:52px; height:52px; border-radius:50%;
    background:#e8f1fb; border:2px solid #4e73df;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 8px; color:#4e73df; font-size:1.1rem;
}
.proc-step .step-title { font-size:0.78rem; font-weight:600; color:#333; line-height:1.3; }
.proc-step .step-sub   { font-size:0.7rem;  color:#888; margin-top:2px; }
.proc-arrow { display:flex; align-items:center; padding-top:14px; color:#bbb; font-size:1.1rem; flex-shrink:0; }

/* 링크 박스 */
.link-box {
    background:#1b3f6a; color:#fff; border-radius:8px; padding:16px;
    display:flex; align-items:center; justify-content:space-between;
    text-decoration:none; margin-bottom:10px; transition:background .15s;
}
.link-box:hover { background:#15345a; color:#fff; text-decoration:none; }
.link-box-text h6 { font-weight:700; font-size:0.9rem; margin-bottom:3px; }
.link-box-text p  { font-size:0.75rem; opacity:.85; margin:0; }
.link-box-icon    { font-size:1.8rem; opacity:.7; }
</style>

<div class="container-fluid px-4 py-3">

    <!-- Row 1: 슬라이더 + 공지사항 -->
    <div class="row mb-4">
        <div class="col-lg-7 mb-3 mb-lg-0">
            <div id="homeCarousel" class="carousel slide shadow rounded" data-ride="carousel">
                <ol class="carousel-indicators">
                    <li data-target="#homeCarousel" data-slide-to="0" class="active"></li>
                    <li data-target="#homeCarousel" data-slide-to="1"></li>
                    <li data-target="#homeCarousel" data-slide-to="2"></li>
                    <li data-target="#homeCarousel" data-slide-to="3"></li>
                </ol>
                <div class="carousel-inner" style="border-radius:6px;overflow:hidden;">
                    <div class="carousel-item active">
                        <img src="assets/img/mv_2.jpg" class="d-block w-100" alt="슬라이드1" style="height:300px;object-fit:cover;">
                    </div>
                    <div class="carousel-item">
                        <img src="assets/img/mv_3.jpg" class="d-block w-100" alt="슬라이드2" style="height:300px;object-fit:cover;">
                    </div>
                    <div class="carousel-item">
                        <img src="assets/img/mv_4.jpg" class="d-block w-100" alt="슬라이드3" style="height:300px;object-fit:cover;">
                    </div>
                    <div class="carousel-item">
                        <img src="assets/img/mv_5.jpg" class="d-block w-100" alt="슬라이드4" style="height:300px;object-fit:cover;">
                    </div>
                </div>
                <a class="carousel-control-prev" href="#homeCarousel" role="button" data-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </a>
                <a class="carousel-control-next" href="#homeCarousel" role="button" data-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </a>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card shadow h-100">
                <div class="card-header py-2 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary">
                        <i class="fas fa-bullhorn mr-1"></i>공지사항
                    </h6>
                    <a href="/notices" class="small text-muted">전체보기 &rsaquo;</a>
                </div>
                <div class="card-body py-2 px-3">
                    <ul class="notice-list list-unstyled mb-0">
                        <li th:each="notice : ${notices}">
                            <a th:href="@{/notices/{id}(id=${notice.id})}" th:text="${notice.subject}">공지 제목</a>
                            <span class="notice-date" th:text="${notice.createdDate}">날짜</span>
                        </li>
                        <li th:if="${#lists.isEmpty(notices)}" style="justify-content:center;color:#aaa;">
                            등록된 공지사항이 없습니다.
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Row 2: 민원상담전화 + 수수료입금안내 -->
    <div class="row mb-4">
        <div class="col-md-6 mb-3 mb-md-0">
            <div class="info-card blue shadow">
                <div class="info-card-icon">
                    <i class="fas fa-phone-alt"></i>
                </div>
                <div class="info-card-body">
                    <h6>민원상담 전화번호</h6>
                    <div class="phone">010-8744-0026</div>
                    <small>전남외광협회 여수시지부</small>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="info-card green shadow">
                <div class="info-card-icon">
                    <i class="fas fa-university"></i>
                </div>
                <div class="info-card-body">
                    <h6>수수료 입금안내</h6>
                    <div class="account">기업 193-110190-04-013</div>
                    <small>주식회사아이비</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Row 3: 접수절차 + 링크박스 -->
    <div class="row">
        <div class="col-lg-8 mb-4">
            <div class="card shadow h-100">
                <div class="card-header py-2">
                    <h6 class="m-0 font-weight-bold text-primary">지정게시대 접수절차</h6>
                </div>
                <div class="card-body d-flex align-items-center py-3">
                    <div class="proc-wrap w-100">
                        <div class="proc-step">
                            <div class="proc-circle"><i class="fas fa-user-plus"></i></div>
                            <div class="step-title">회원가입 및 승인</div>
                        </div>
                        <div class="proc-arrow"><i class="fas fa-chevron-right"></i></div>
                        <div class="proc-step">
                            <div class="proc-circle"><i class="fas fa-sign-in-alt"></i></div>
                            <div class="step-title">승인 후 로그인</div>
                        </div>
                        <div class="proc-arrow"><i class="fas fa-chevron-right"></i></div>
                        <div class="proc-step">
                            <div class="proc-circle"><i class="fas fa-calendar-alt"></i></div>
                            <div class="step-title">매일 접수가능</div>
                        </div>
                        <div class="proc-arrow"><i class="fas fa-chevron-right"></i></div>
                        <div class="proc-step">
                            <div class="proc-circle"><i class="fas fa-won-sign"></i></div>
                            <div class="step-title">수수료입금</div>
                            <div class="step-sub">신청당일<br>17시까지</div>
                        </div>
                        <div class="proc-arrow"><i class="fas fa-chevron-right"></i></div>
                        <div class="proc-step">
                            <div class="proc-circle"><i class="fas fa-flag"></i></div>
                            <div class="step-title">현수막제출</div>
                            <div class="step-sub">부착 3일전까지</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4 mb-4">
            <a href="/sectionStatus" class="link-box shadow">
                <div class="link-box-text">
                    <h6>지정게시대 현황</h6>
                    <p>관내 운영중인 지정게시대 현황,<br>위치를 확인하세요!</p>
                </div>
                <div class="link-box-icon"><i class="fas fa-map-marker-alt"></i></div>
            </a>
            <a href="/information" class="link-box shadow">
                <div class="link-box-text">
                    <h6>이용안내 확인</h6>
                    <p>게시대 신청방법, 현수막 규격<br>및 유의사항을 확인합니다.</p>
                </div>
                <div class="link-box-icon"><i class="fas fa-info-circle"></i></div>
            </a>
        </div>
    </div>

</div>

</th:block>
</html>
