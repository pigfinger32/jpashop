# .github/workflows/deploy.yml
name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches:
      - master # master 브랜치에 push 이벤트 발생 시 워크플로우 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # GitHub Actions 러너 환경

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: List build outputs # 디버깅용: 제거해도 됨
        run: ls -l build/libs/

      # === 수정될 부분 ===
      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 동적으로 JAR 파일 이름을 찾기 위해 와일드카드 사용
          source: "build/libs/*.jar" # <-- 이 부분을 이렇게 수정합니다.
          target: "/tmp"
      # === /수정될 부분 ===

      - name: Execute Deployment Script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_PATH="/opt/jpashop-app"
            # JAR_NAME 변수도 와일드카드에 맞춰 실제 파일 이름을 찾도록 수정
            # /tmp/ 에 있는 jpashop- 로 시작하고 .jar 로 끝나는 파일을 찾습니다.
            TRANSFER_JAR_NAME=$(ls /tmp/jpashop-*.jar | xargs basename) # <--- 이 부분도 수정

            CURRENT_APP_PATH="$APP_PATH/$TRANSFER_JAR_NAME"

            echo "Ensuring application directory exists with proper permissions..."
            sudo mkdir -p $APP_PATH
            sudo chown ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} $APP_PATH

            # 현재 실행 중인 애플리케이션 PID 확인 및 종료
            # PID를 찾을 때도 와일드카드 이름을 활용
            CURRENT_PID=$(pgrep -f "java -jar $APP_PATH/jpashop-*.jar") # <--- 이 부분도 수정
            if [ -n "$CURRENT_PID" ]; then
              echo "Existing application process found. PID: $CURRENT_PID. Killing it..."
              sudo kill -9 $CURRENT_PID
              sleep 5
            fi

            echo "Moving new JAR file from /tmp to $APP_PATH..."
            # /tmp로 전송된 파일을 sudo 권한으로 실제 앱 경로로 이동
            sudo mv /tmp/$TRANSFER_JAR_NAME $APP_PATH/ # <--- 이동할 때 파일명은 TRANSFER_JAR_NAME 사용

            # JAR 파일에 실행 권한 부여
            sudo chmod +x $CURRENT_APP_PATH

            echo "Starting new application..."
            # 애플리케이션을 EC2_USER (예: ubuntu) 권한으로 백그라운드 실행
            sudo -u ${{ secrets.EC2_USER }} nohup java -jar $CURRENT_APP_PATH > $APP_PATH/nohup.out 2>&1 &

            sleep 10 # 애플리케이션 시작 대기

            echo "Deployment finished. Checking if new process is running..."
            # 새 프로세스 확인 시에도 와일드카드 이름 활용
            NEW_PID=$(pgrep -f "java -jar $APP_PATH/jpashop-*.jar") # <--- 이 부분도 수정
            if [ -n "$NEW_PID" ]; then
              echo "New application is running. PID: $NEW_PID"
            else
              echo "Failed to start new application. Check $APP_PATH/nohup.out for details."
              exit 1
            fi
