# .github/workflows/deploy.yml

name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches:
      - master # master 브랜치에 push 이벤트 발생 시 워크플로우 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test # build/libs/jpashop-1.0.1-SNAPSHOT.jar 가 생성됩니다.

      - name: Deploy to EC2 # Deploy to EC2 단계 수정
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Source와 Target 옵션으로 JAR 파일을 직접 전송
          source: "build/libs/jpashop-1.0.1-SNAPSHOT.jar" # 빌드된 JAR 파일 경로
          target: "/tmp/jpashop-1.0.1-SNAPSHOT.jar" # EC2의 임시 디렉토리로 먼저 전송 (일반 사용자도 권한 있는 곳)
          script: | # EC2에서 실행될 스크립트
            # 애플리케이션의 최종 배포 경로
            APP_PATH="/opt/your-app" # 이 디렉토리는 나중에 sudo 권한으로 생성하고 사용할 것입니다.
            JAR_NAME="jpashop-1.0.1-SNAPSHOT.jar"
            CURRENT_APP_PATH="$APP_PATH/$JAR_NAME" # 최종적으로 JAR 파일이 위치할 경로

            echo "Ensuring application directory exists with proper permissions..."
            # /opt/your-app 디렉토리가 없으면 생성하고, 권한 설정
            # sudo 권한으로 디렉토리 생성 및 소유권 설정
            sudo mkdir -p $APP_PATH
            # EC2_USER는 ubuntu@ip... 의 ubuntu 사용자입니다. 이 사용자에게 디렉토리 소유권을 줍니다.
            sudo chown ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} $APP_PATH

            # 현재 실행 중인 애플리케이션 PID 확인 및 종료
            CURRENT_PID=$(pgrep -f $JAR_NAME)
            if [ -n "$CURRENT_PID" ]; then
              echo "Existing application process found. PID: $CURRENT_PID. Killing it..."
              sudo kill -9 $CURRENT_PID
              sleep 5
            fi

            echo "Moving new JAR file from /tmp to $APP_PATH..."
            # /tmp로 전송된 파일을 sudo 권한으로 실제 앱 경로로 이동
            sudo mv /tmp/$JAR_NAME $APP_PATH/$JAR_NAME
            
            # JAR 파일에 실행 권한 부여
            sudo chmod +x $CURRENT_APP_PATH

            echo "Starting new application..."
            # 애플리케이션을 sudo로 실행하거나, sudo로 해당 사용자로 전환하여 실행
            # 백그라운드 실행을 위해 'nohup' 사용. 로그는 앱 경로의 nohup.out에 저장
            sudo -u ${{ secrets.EC2_USER }} nohup java -jar $CURRENT_APP_PATH > $APP_PATH/nohup.out 2>&1 &
            # `sudo -u ${{ secrets.EC2_USER }}`를 사용하면, ${{ secrets.EC2_USER }} (예: ubuntu) 권한으로 명령을 실행합니다.

            sleep 10 # 애플리케이션 시작 대기

            echo "Deployment finished. Checking if new process is running..."
            NEW_PID=$(pgrep -f $JAR_NAME)
            if [ -n "$NEW_PID" ]; then
              echo "New application is running. PID: $NEW_PID"
            else
              echo "Failed to start new application. Check $APP_PATH/nohup.out for details."
              exit 1
            fi
