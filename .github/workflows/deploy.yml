# .github/workflows/deploy.yml

name: Spring Boot CI/CD to AWS EC2 # 워크플로우의 이름

on:
  push:
    branches:
      - master # master 브랜치에 push 이벤트 발생 시 워크플로우 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # GitHub Actions 러너 환경 (Ubuntu 최신 버전 사용)

    steps:
      - name: Checkout Code # 깃허브 리포지토리의 코드를 러너로 가져옵니다.
        uses: actions/checkout@v4

      - name: Set up JDK 11 # 자바 11 JDK 환경을 설정합니다.
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin' # OpenJDK 배포판 중 'Temurin'을 사용합니다.

      - name: Grant execute permission for gradlew # gradlew 스크립트에 실행 권한을 부여합니다.
        run: chmod +x gradlew

      - name: Build with Gradle # Spring Boot 애플리케이션을 Gradle을 사용하여 빌드합니다.
        run: ./gradlew build -x test # 테스트(test) 단계는 건너뛰고 빌드합니다. (빌드 시간 단축)
        # 이 단계에서 'build/libs/' 디렉토리 내에 JAR 파일이 생성됩니다.

      # --- 1단계: 빌드된 JAR 파일을 EC2의 사용자 홈 디렉토리로 전송 ---
      # (파일명을 원본 그대로 전송합니다. 예: jpashop-1.0.1-SNAPSHOT-20250725060054.jar)
      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@master # 파일을 EC2로 안전하게 전송하기 위한 액션을 사용합니다.
        with:
          host: ${{ secrets.EC2_HOST }} # EC2 인스턴스의 IP 주소 (GitHub Secret에서 가져옴)
          username: ${{ secrets.EC2_USER }} # EC2 인스턴스에 접속할 사용자명 (GitHub Secret에서 가져옴)
          key: ${{ secrets.EC2_SSH_KEY }} # EC2 접속에 사용할 SSH 키 (GitHub Secret에서 가져옴)
          source: "build/libs/*.jar" # GitHub Actions 러너에서 빌드된 JAR 파일의 경로 (와일드카드 사용)
          target: "/home/${{ secrets.EC2_USER }}/" # EC2 사용자 홈 디렉토리로 전송 (예: /home/ubuntu/)

      # === 2단계: SSH를 통해 EC2에서 배포 스크립트 실행 ===
      # (전송된 JAR 파일을 처리하고 애플리케이션을 배포합니다.)
      - name: Execute Deployment Script on EC2
        uses: appleboy/ssh-action@master # SSH를 통해 EC2에서 명령어를 실행하기 위한 액션을 사용합니다.
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: | # EC2에서 실행될 쉘 스크립트입니다.
            # --- 변수 정의 ---
            EC2_TARGET_USER="${{ secrets.EC2_USER }}" # EC2 접속 사용자명
            APP_PATH="/opt/jpashop-app" # 애플리케이션 JAR 파일이 최종적으로 위치할 경로
            FINAL_JAR_NAME="jpashop-app.jar" # EC2 내 최종 경로에 저장될 고정된 JAR 파일명 (원하는 이름으로 변경 가능)
            CURRENT_APP_PATH="$APP_PATH/$FINAL_JAR_NAME" # 최종적으로 JAR 파일이 위치할 전체 경로
            APP_PORT="8080" # Spring Boot 애플리케이션이 사용할 포트 번호

            # --- 애플리케이션 디렉토리 준비 ---
            echo "Ensuring application directory exists with proper permissions..."
            sudo mkdir -p "$APP_PATH" # 애플리케이션 배포 디렉토리가 없으면 sudo 권한으로 생성합니다.
            sudo chown "$EC2_TARGET_USER":"$EC2_TARGET_USER" "$APP_PATH" # 생성된 디렉토리의 소유권을 EC2 사용자에게 줍니다.

            # --- 전송된 JAR 파일 찾기 ---
            # 사용자 홈 디렉토리 내, scp-action이 생성한 'build/libs' 디렉토리 안에서 JAR 파일을 찾습니다.
            TRANSFER_SOURCE_PATH=$(find "/home/$EC2_TARGET_USER/build/libs" -maxdepth 1 -name "jpashop-*.jar" -print -quit)
            
            # JAR 파일을 찾지 못했다면 에러를 출력하고 스크립트를 종료합니다.
            if [ -z "$TRANSFER_SOURCE_PATH" ]; then
                echo "Error: No jpashop JAR file found in /home/$EC2_TARGET_USER/build/libs after transfer. Deployment aborted."
                exit 1 
            fi
            
            # --- 모든 관련된 Java 프로세스 및 포트 점유 프로세스 종료 ---
            echo "Attempting to terminate all relevant Java processes and processes on port $APP_PORT..."

            # 1. 'java -jar'를 포함하는 모든 프로세스 찾아서 종료 시도 (광범위하게 검사)
            #    ps -ef는 모든 프로세스를 보여주고, grep으로 java를 포함하는 라인을 찾은 후, grep -v grep으로 grep 명령 자신은 제외.
            #    awk '{print $2}'로 PID만 추출합니다.
            PIDS_TO_KILL_JAVA=$(ps -ef | grep "java -jar" | grep -v grep | awk '{print $2}')
            
            if [ -n "$PIDS_TO_KILL_JAVA" ]; then
                echo "Found general Java JAR processes with PIDs: $PIDS_TO_KILL_JAVA. Attempting graceful termination (SIGTERM)..."
                # xargs -r kill은 PID가 없을 때 kill 명령을 실행하지 않습니다.
                echo "$PIDS_TO_KILL_JAVA" | xargs -r sudo kill # 기본 (SIGTERM) 종료 시도
                sleep 5 # Graceful 종료를 위한 대기 시간
            fi

            # 2. $APP_PORT (8080)을 사용 중인 모든 프로세스 강제 종료 시도 (가장 확실한 포트 정리)
            # sudo 권한으로 lsof를 실행하여 해당 포트를 점유하는 프로세스의 PID를 찾습니다.
            PORT_LISTENING_PIDS=$(sudo lsof -t -i :"$APP_PORT")
            if [ -n "$PORT_LISTENING_PIDS" ]; then
                echo "Found processes listening on port $APP_PORT with PIDs: $PORT_LISTENING_PIDS. Forcibly killing them (SIGKILL)..."
                echo "$PORT_LISTENING_PIDS" | xargs -r sudo kill -9 # 강제 종료
                sleep 5 # 강제 종료 대기 시간
            else
                echo "No process found directly listening on port $APP_PORT."
            fi

            # 최종적으로 어떤 프로세스도 남아있지 않은지 다시 확인 (방어적 코드)
            # 모든 'java' 프로세스 및 포트 점유 프로세스가 완전히 종료되었는지 마지막으로 검증합니다.
            FINAL_PROCESS_CHECK=$(ps -ef | grep "java" | grep -v grep | awk '{print $2}')
            if [ -n "$FINAL_PROCESS_CHECK" ]; then
                echo "CRITICAL: Some Java processes still running after all kill attempts! PIDs: $FINAL_PROCESS_CHECK"
                echo "This indicates a major issue with process termination. Deployment will fail."
                exit 1 # 프로세스 종료에 실패하면 워크플로우를 종료합니다.
            else
                echo "All relevant processes successfully terminated."
            fi
            
            # --- JAR 파일 이동 및 권한 설정 ---
            echo "Moving new JAR file from source to $APP_PATH..."
            # 전송된 파일을 최종 경로로 이동시키면서, 고정된 이름(FINAL_JAR_NAME)으로 변경합니다.
            sudo mv "$TRANSFER_SOURCE_PATH" "$CURRENT_APP_PATH"
            # JAR 파일에 실행 권한을 부여합니다.
            sudo chmod +x "$CURRENT_APP_PATH"

            # --- 새로운 애플리케이션 시작 ---
            echo "Starting new application..."
            # 애플리케이션을 EC2 접속 사용자 권한으로 백그라운드에서 실행하고, 로그는 nohup.out에 저장합니다.
            sudo -u "$EC2_TARGET_USER" nohup java -jar "$CURRENT_APP_PATH" > "$APP_PATH/nohup.out" 2>&1 &

            sleep 10 # 애플리케이션이 시작될 시간을 충분히 기다립니다.

            # --- 배포 성공 여부 확인 ---
            echo "Deployment finished. Checking if new process is running..."
            # 새로 시작된 애플리케이션의 PID를 확인하여 정상적으로 실행되었는지 검증합니다.
            NEW_PID=$(pgrep -f "java -jar $CURRENT_APP_PATH")
            if [ -n "$NEW_PID" ]; then
              echo "New application is running. PID: $NEW_PID"
            else
              echo "Failed to start new application. Check $APP_PATH/nohup.out for details."
              exit 1 # 애플리케이션 시작에 실패하면 워크플로우를 종료합니다.
            fi
