# .github/workflows/deploy.yml

name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches:
      - master # master 브랜치에 push 이벤트 발생 시 워크플로우 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # GitHub Actions 러너 환경 (Ubuntu 최신 버전)

    steps:
      - name: Checkout Code # 깃허브 리포지토리 코드 가져오기
        uses: actions/checkout@v4

      - name: Set up JDK 11 # 자바 11 JDK 설정
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin' # OpenJDK 배포판 중 하나 (Oracle OpenJDK, Eclipse Adoptium 등 선택 가능)

      - name: Grant execute permission for gradlew # gradlew 스크립트 실행 권한 부여
        run: chmod +x gradlew

      - name: Build with Gradle # Spring Boot 애플리케이션 빌드
        run: ./gradlew build -x test # 테스트(test)는 건너뛰고 빌드 (-x test는 빌드 시간 단축 목적. 테스트가 중요하다면 삭제)
        # build/libs/your-app-name-0.0.1-SNAPSHOT.jar 와 같은 JAR 파일이 생성됩니다.

      - name: Configure SSH Key Permissions # SSH 키 파일 권한 설정 (보안 강화)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa # GitHub Secret에 저장된 키 내용을 파일로 저장
          chmod 600 ~/.ssh/id_rsa # 키 파일에 대한 권한을 소유자만 읽고 쓸 수 있도록 설정
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts # SSH 호스트 키를 known_hosts에 추가 (첫 연결 시 확인 방지)
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }} # 환경 변수로 Secrets 사용

      - name: Deploy to EC2 # EC2로 배포
        uses: appleboy/ssh-action@master # SSH를 통해 원격 서버 명령 실행 및 파일 전송을 위한 GitHub Action
        with:
          host: ${{ secrets.EC2_HOST }} # EC2 인스턴스 IP 주소 (Secrets에서 가져옴)
          username: ${{ secrets.EC2_USER }} # EC2 인스턴스 사용자명 (Secrets에서 가져옴)
          key: ${{ secrets.EC2_SSH_KEY }} # EC2 접속용 SSH 키 (Secrets에서 가져옴)
          script: | # EC2에서 실행될 쉘 스크립트
            # Spring Boot 애플리케이션이 배포될 경로 (예: /opt/your-app/)
            APP_PATH="/opt/your-app" # 실제 애플리케이션 경로로 수정하세요. (톰캣 홈 디렉토리가 아닐 수도 있습니다.)
            JAR_NAME="jpashop-1.0.1-SNAPSHOT.jar" # 빌드된 JAR 파일명으로 수정하세요.
            OLD_JAR_PATH="$APP_PATH/$JAR_NAME"

            # 배포 경로로 이동 또는 생성
            mkdir -p $APP_PATH
            cd $APP_PATH

            # 현재 실행 중인 애플리케이션 PID 확인 및 종료
            CURRENT_PID=$(pgrep -f $JAR_NAME) # JAR 파일 이름으로 PID 찾기
            if [ -n "$CURRENT_PID" ]; then # PID가 존재하면
              echo "Existing application process found. PID: $CURRENT_PID. Killing it..."
              kill -9 $CURRENT_PID # 강제 종료
              sleep 5 # 프로세스 종료 대기
            fi

            # 기존 JAR 파일 삭제 또는 백업 (선택 사항)
            if [ -f "$OLD_JAR_PATH" ]; then
              echo "Removing old JAR file..."
              rm $OLD_JAR_PATH
            fi

            # 새로운 JAR 파일 전송 (GitHub Actions Runner -> EC2)
            # 이 단계는 scp-action을 사용하는 대신 ssh-action 내에서 파일을 직접 가져오는 방식으로 변경됨
            echo "Copying new JAR file from GitHub Actions runner..."
            # GitHub Actions Runner에서 EC2로 JAR 파일을 복사합니다.
            # 이 명령은 GitHub Actions 러너에서 실행되므로, 로컬 빌드 경로를 기준으로 합니다.
            # artifacts 디렉토리에서 빌드된 JAR 파일을 EC2의 현재 디렉토리($APP_PATH)로 scp 복사합니다.
            # 이는 appleboy/scp-action을 사용하는 것과 유사한 효과를 줍니다.
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ./build/libs/$JAR_NAME $EC2_USER@$EC2_HOST:$APP_PATH/$JAR_NAME

            # 새로운 JAR 파일 실행
            echo "Starting new application..."
            nohup java -jar $APP_PATH/$JAR_NAME > $APP_PATH/nohup.out 2>&1 & # 백그라운드에서 실행하고 로그는 nohup.out에 저장
            sleep 10 # 애플리케이션 시작 대기

            echo "Deployment finished. Checking if new process is running..."
            NEW_PID=$(pgrep -f $JAR_NAME)
            if [ -n "$NEW_PID" ]; then
              echo "New application is running. PID: $NEW_PID"
            else
              echo "Failed to start new application."
              exit 1 # 실패 시 워크플로우 종료
            fi
