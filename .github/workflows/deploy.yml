# .github/workflows/deploy.yml

name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches:
      - master # master 브랜치에 push 이벤트 발생 시 워크플로우 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # GitHub Actions 러너 환경 (Ubuntu 최신 버전)

    steps:
      - name: Checkout Code # 깃허브 리포지토리 코드 가져오기
        uses: actions/checkout@v4

      - name: Set up JDK 11 # 자바 11 JDK 설정
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin' # OpenJDK 배포판 중 하나 (Oracle OpenJDK, Eclipse Adoptium 등 선택 가능)

      - name: Grant execute permission for gradlew # gradlew 스크립트 실행 권한 부여
        run: chmod +x gradlew

      - name: Build with Gradle # Spring Boot 애플리케이션 빌드
        run: ./gradlew build -x test # 테스트(test)는 건너뛰고 빌드 (-x test는 빌드 시간 단축 목적)
        # 이 단계에서 build/libs/ 에 JAR 파일이 생성됩니다.

      # === 1단계: 빌드된 JAR 파일을 EC2 사용자 홈 디렉토리(~)로 전송 ===
      # (파일명은 원본 그대로 전송됩니다. 예: jpashop-1.0.1-SNAPSHOT-20250725060054.jar)
      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@master # 파일을 전송하기 위한 액션 사용
        with:
          host: ${{ secrets.EC2_HOST }} # EC2 인스턴스 IP 주소 (GitHub Secret)
          username: ${{ secrets.EC2_USER }} # EC2 인스턴스 사용자명 (GitHub Secret)
          key: ${{ secrets.EC2_SSH_KEY }} # EC2 접속용 SSH 키 (GitHub Secret)
          source: "build/libs/*.jar" # GitHub Actions 러너에서 빌드된 JAR 파일의 경로 (와일드카드 사용)
          target: "/home/${{ secrets.EC2_USER }}/" # EC2 사용자 홈 디렉토리로 전송 (예: /home/ubuntu/)

      # === 2단계: SSH를 통해 EC2에서 배포 스크립트 실행 (전송된 파일 처리) ===
      - name: Execute Deployment Script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: | # EC2에서 실행될 쉘 스크립트
            # --- 변수 정의 ---
            EC2_TARGET_USER="${{ secrets.EC2_USER }}"
            APP_PATH="/opt/jpashop-app"
            FINAL_JAR_NAME="jpashop-app.jar"
            CURRENT_APP_PATH="$APP_PATH/$FINAL_JAR_NAME"
            APP_PORT="8080" # <-- 애플리케이션 포트

            # --- 애플리케이션 디렉토리 준비 ---
            echo "Ensuring application directory exists with proper permissions..."
            sudo mkdir -p "$APP_PATH"
            sudo chown "$EC2_TARGET_USER":"$EC2_TARGET_USER" "$APP_PATH"

            # --- 전송된 JAR 파일 찾기 ---
            TRANSFER_SOURCE_PATH=$(find "/home/$EC2_TARGET_USER/build/libs" -maxdepth 1 -name "jpashop-*.jar" -print -quit)
            if [ -z "$TRANSFER_SOURCE_PATH" ]; then
                echo "Error: No jpashop JAR file found in /home/$EC2_TARGET_USER/build/libs after transfer. Deployment aborted."
                exit 1
            fi
            
            # --- 핵심 수정: 모든 관련된 Java 프로세스 종료 + 포트 점유 프로세스 종료 ---
            echo "Attempting to terminate all relevant Java processes and processes on port $APP_PORT..."

            # 1. 'sudo -u <user> nohup java -jar' 명령 패턴으로 부모 프로세스 찾기 (가장 정확한 프로세스 패턴)
            #    이전 PID (36942)와 유사한 패턴으로 찾습니다.
            RUNNING_ROOT_NOHUP_JAVA_PIDS=$(pgrep -f "sudo -u ${EC2_TARGET_USER} nohup java -jar $CURRENT_APP_PATH") # <--- 패턴 수정
            if [ -n "$RUNNING_ROOT_NOHUP_JAVA_PIDS" ]; then
                echo "Found root nohup Java process with PID(s): $RUNNING_ROOT_NOHUP_JAVA_PIDS. Killing them gracefully first..."
                echo "$RUNNING_ROOT_NOHUP_JAVA_PIDS" | xargs -r sudo kill
                sleep 5 # 종료 대기 시간
            fi

            # 2. 'java -jar' 명령 패턴으로 직접 실행된 자식 프로세스 찾기 (혹시 부모가 죽은 후 남은 경우)
            RUNNING_CHILD_JAVA_PIDS=$(pgrep -f "java -jar $CURRENT_APP_PATH") # <--- 패턴 수정
            if [ -n "$RUNNING_CHILD_JAVA_PIDS" ]; then
                echo "Found child Java process with PID(s): $RUNNING_CHILD_JAVA_PIDS. Killing them gracefully..."
                echo "$RUNNING_CHILD_JAVA_PIDS" | xargs -r sudo kill
                sleep 5 # 종료 대기 시간
            fi

            # 3. $APP_PORT (8080)을 사용 중인 모든 프로세스 강제 종료 시도 (가장 확실한 포트 정리)
            PORT_LISTENING_PIDS=$(sudo lsof -t -i :"$APP_PORT")
            if [ -n "$PORT_LISTENING_PIDS" ]; then
                echo "Found processes listening on port $APP_PORT with PID(s): $PORT_LISTENING_PIDS. Forcibly killing them..."
                echo "$PORT_LISTENING_PIDS" | xargs -r sudo kill -9 # 강제 종료
                sleep 5 # 종료 대기 시간
            else
                echo "No process found on port $APP_PORT."
            fi

            # 최종적으로 어떤 프로세스도 남아있지 않은지 다시 확인 (방어적 코드)
            # 이주환8238님의 경우는 pgrep -f "java"만으로도 충분히 남아있는지 확인할 수 있습니다.
            # sudo lsof -t -i :"$APP_PORT" 를 같이 쓰면 좋지만,
            # 포트 문제는 애플리케이션 시작시 발견될 것이므로, 여기서는 자바 프로세스만 확인해도 됩니다.
            FINAL_PROCESS_CHECK=$(pgrep -f "java") 
            if [ -n "$FINAL_PROCESS_CHECK" ]; then
                echo "Critical Warning: Some Java processes still running after kill attempts!"
                echo "Remaining Java PIDs: $FINAL_PROCESS_CHECK"
                exit 1 # 잠재적인 문제를 무시하지 않고 워크플로우를 실패시킴 (이 부분은 선택 사항, 문제 해결을 위해 유지)
            else
                echo "All relevant processes successfully terminated."
            fi
            # --- /핵심 수정 ---

            # --- JAR 파일 이동 및 권한 설정 ---
            echo "Moving new JAR file to $APP_PATH..."
            sudo mv "$TRANSFER_SOURCE_PATH" "$CURRENT_APP_PATH"
            sudo chmod +x "$CURRENT_APP_PATH"

            # --- 새로운 애플리케이션 시작 ---
            echo "Starting new application..."
            sudo -u "$EC2_TARGET_USER" nohup java -jar "$CURRENT_APP_PATH" > "$APP_PATH/nohup.out" 2>&1 &

            sleep 10 # 애플리케이션 시작을 기다립니다.

            # --- 배포 성공 여부 확인 ---
            echo "Deployment finished. Checking if new process is running..."
            NEW_PID=$(pgrep -f "java -jar $CURRENT_APP_PATH")
            if [ -n "$NEW_PID" ]; then
              echo "New application is running. PID: $NEW_PID"
            else
              echo "Failed to start new application. Check $APP_PATH/nohup.out for details."
              exit 1 # 애플리케이션 시작 실패 시 워크플로우 실패
            fi
