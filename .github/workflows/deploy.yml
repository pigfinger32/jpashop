# .github/workflows/deploy.yml

name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches:
      - master # master 브랜치에 push 이벤트 발생 시 워크플로우 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # GitHub Actions 러너 환경 (Ubuntu 최신 버전)

    steps:
      - name: Checkout Code # 깃허브 리포지토리 코드 가져오기
        uses: actions/checkout@v4

      - name: Set up JDK 11 # 자바 11 JDK 설정
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin' # OpenJDK 배포판 중 하나 (Oracle OpenJDK, Eclipse Adoptium 등 선택 가능)

      - name: Grant execute permission for gradlew # gradlew 스크립트 실행 권한 부여
        run: chmod +x gradlew

      - name: Build with Gradle # Spring Boot 애플리케이션 빌드
        run: ./gradlew build -x test # 테스트(test)는 건너뛰고 빌드 (-x test는 빌드 시간 단축 목적)
        # 이 단계에서 build/libs/ 에 JAR 파일이 생성됩니다.

      # === 1단계: 빌드된 JAR 파일을 EC2 사용자 홈 디렉토리(~)로 전송 ===
      # (파일명은 원본 그대로 전송됩니다. 예: jpashop-1.0.1-SNAPSHOT-20250725060054.jar)
      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@master # 파일을 전송하기 위한 액션 사용
        with:
          host: ${{ secrets.EC2_HOST }} # EC2 인스턴스 IP 주소 (GitHub Secret)
          username: ${{ secrets.EC2_USER }} # EC2 인스턴스 사용자명 (GitHub Secret)
          key: ${{ secrets.EC2_SSH_KEY }} # EC2 접속용 SSH 키 (GitHub Secret)
          source: "build/libs/*.jar" # GitHub Actions 러너에서 빌드된 JAR 파일의 경로 (와일드카드 사용)
          target: "/home/${{ secrets.EC2_USER }}/" # EC2 사용자 홈 디렉토리로 전송 (예: /home/ubuntu/)

      # === 2단계: SSH를 통해 EC2에서 배포 스크립트 실행 (전송된 파일 처리) ===
      - name: Execute Deployment Script on EC2
        uses: appleboy/ssh-action@master # SSH를 통해 원격 서버 명령 실행 액션 사용
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 스크립트를 YAML 내부 변수로 전달하여 파싱 오류 가능성 최소화
          script: |
            # --- 변수 정의 ---
            EC2_TARGET_USER="${{ secrets.EC2_USER }}" # EC2 접속 사용자명을 변수로 저장
            APP_PATH="/opt/jpashop-app" # 애플리케이션의 최종 배포 경로
            FINAL_JAR_NAME="jpashop-app.jar" # EC2 내 최종 경로에 저장될 고정된 JAR 파일명
            CURRENT_APP_PATH="$APP_PATH/$FINAL_JAR_NAME" # 최종 JAR 파일의 전체 경로

            # --- 애플리케이션 디렉토리 준비 ---
            echo "Ensuring application directory exists with proper permissions..."
            sudo mkdir -p "$APP_PATH" # 디렉토리 생성
            sudo chown "$EC2_TARGET_USER":"$EC2_TARGET_USER" "$APP_PATH" # 소유권 변경

            # --- 전송된 JAR 파일 찾기 ---
            # 사용자 홈 디렉토리 내, scp-action이 생성한 'build/libs' 디렉토리 안에서 JAR 파일을 찾습니다.
            TRANSFER_SOURCE_PATH=$(find "/home/$EC2_TARGET_USER/build/libs" -maxdepth 1 -name "jpashop-*.jar" -print -quit)

            if [ -z "$TRANSFER_SOURCE_PATH" ]; then # JAR 파일을 찾지 못했다면 에러 처리
                echo "Error: No jpashop JAR file found in /home/$EC2_TARGET_USER/build/libs after transfer. Deployment aborted."
                exit 1 # 스크립트 종료 및 워크플로우 실패
            fi
            
            # --- 기존 애플리케이션 종료 ---
            echo "Checking for existing application process..."
            CURRENT_PID=$(pgrep -f "java -jar $CURRENT_APP_PATH") # 현재 실행 중인 프로세스 PID 확인
            if [ -n "$CURRENT_PID" ]; then # PID가 존재하면
              echo "Existing application process found. PID: $CURRENT_PID. Killing it..."
              sudo kill -9 "$CURRENT_PID" # 강제 종료
              sleep 5 # 프로세스 종료를 기다립니다.
            else
              echo "No existing application process found."
            fi

            # --- JAR 파일 이동 및 권한 설정 ---
            echo "Moving new JAR file to $APP_PATH..."
            sudo mv "$TRANSFER_SOURCE_PATH" "$CURRENT_APP_PATH" # 전송된 파일을 최종 경로로 이동
            sudo chmod +x "$CURRENT_APP_PATH" # 실행 권한 부여

            # --- 새로운 애플리케이션 시작 ---
            echo "Starting new application..."
            # EC2 접속 사용자 권한으로 백그라운드에서 실행, 로그는 파일에 저장
            sudo -u "$EC2_TARGET_USER" nohup java -jar "$CURRENT_APP_PATH" > "$APP_PATH/nohup.out" 2>&1 &

            sleep 10 # 애플리케이션 시작을 기다립니다.

            # --- 배포 성공 여부 확인 ---
            echo "Deployment finished. Checking if new process is running..."
            NEW_PID=$(pgrep -f "java -jar $CURRENT_APP_PATH") # 새로 시작된 프로세스 PID 확인
            if [ -n "$NEW_PID" ]; then
              echo "New application is running. PID: $NEW_PID"
            else
              echo "Failed to start new application. Check $APP_PATH/nohup.out for details."
              exit 1 # 애플리케이션 시작 실패 시 워크플로우 실패
            fi
