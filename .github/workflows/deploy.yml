name: Spring Boot CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Prepare JAR for transfer
        run: cp build/libs/jpashop-*.jar jpashop-app.jar

      - name: Transfer files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "jpashop-app.jar,Dockerfile,docker-compose.yml"
          target: "/home/${{ secrets.SERVER_USER }}/jpashop"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/jpashop

            cat > .env << 'EOF'
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            EOF

            docker compose down || true
            docker compose up --build -d

            sleep 20

            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "Deployment successful"
            else
              echo "Health check failed. Printing logs:"
              docker compose logs app --tail=50
              exit 1
            fi
